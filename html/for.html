<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="sty.css">
</head>

<body>
    <div class="login-box">
        <h2>Login</h2>

        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
